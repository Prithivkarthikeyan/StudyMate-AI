<!DOCTYPE html>
<html>
<head>
    <title>StudyMate AI - Home</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000000; /* Pure Black Base */
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Silver/Grey glow */
        .ambient-blob1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #333333; 
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.6;
        }
        .ambient-blob2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #1a1a1a;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.8;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        p {
            color: #a3a3a3;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        input[type="file"] {
            display: block;
            margin: 0 auto 30px auto;
            color: #ffffff;
            font-family: inherit;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.2);
            background: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="ambient-blob1"></div>
    <div class="ambient-blob2"></div>

    <div class="upload-container">
        <h1>StudyMate AI</h1>
        <p>Transform your PDFs into magical flashcards.</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf_file" accept=".pdf" required>
            <button type="submit">Generate Flashcards</button>
        </form>
    </div>

</body>
</html>
